#version: '3.8'

services:
  # 메인 데이터베이스 (PostgreSQL)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: psik-db
    environment:
      POSTGRES_DB: psik_postgres_db
      POSTGRES_USER: psik
      # 비밀번호는 같은 폴더 .env의 DB_PASSWORD에서 읽는다 (.env는 git 제외)
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 없습니다}
    ports:
      - "5432:5432"
    volumes:
      # 로컬의 ./db/data 폴더에 DB 데이터를 저장 (컨테이너 내려도 데이터 유지)
      - ./db/data:/var/lib/postgresql/data
    restart: always